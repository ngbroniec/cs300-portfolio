<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name: Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <!-- Header and navigation: your name or logo, and links to your main sections. -->
  </header>
  <main>
    <section id="introduction">
      <!-- Introduction: your name, a one-line headline, a short welcome, and a link to your work. -->
    </section>
    <section id="about">
      <!-- About: your interests, studies, and goals. No home address, phone number, or student ID. -->
    </section>
    <section id="projects">
      <!-- Projects: at least two work samples, each with a card and a short case study. -->
    </section>
    <section id="skills">
      <!-- Skills: the skills your work samples show, each connected to a sample. -->
    </section>
    <section id="contact">
      <!-- Contact: a professional way to reach you, such as a profile link. -->
    </section>
    <section id="resume">
      <!-- Resume: a resume section or a link to a downloadable resume PDF. -->
    </section>
  </main>
  <footer>
    <!-- Footer: your name, the year, and your profile links. -->
  </footer>
  <script src="app.js"></script>
</body>
</html>
